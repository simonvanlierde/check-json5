# check-json5 on PyPI from 2.0 on: the old name, installing jsonvet. No code of its own.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "check-json5"
version = "2.1.0"
description = "Renamed to jsonvet: installing check-json5 installs jsonvet."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["jsonvet==2.1.0"]

[project.urls]
Source = "https://github.com/simonvanlierde/jsonvet"

[tool.hatch.build.targets.wheel]
bypass-selection = true
