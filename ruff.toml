# Lint and format settings for the repo's Python: the python -m shim, the hook placeholder,
# the check-json5 compatibility package and scripts/.
line-length = 120
# The scripts need 3.11; the shim pins 3.9 in its own pyproject.toml.
target-version = "py311"

[format]
docstring-code-format = true

[lint]
extend-select = ["ALL"]
ignore = [
  "COM812", # missing-trailing-comma: conflicts with the formatter
  "CPY001", # missing-copyright-notice: LICENSE covers the project
  "ISC001", # single-line-implicit-string-concatenation: conflicts with the formatter
]

[lint.per-file-ignores]
# Standalone scripts that print their results.
"scripts/**" = ["INP001", "T201"]
# The placeholder is not a package, and the shim is a package's __main__.
"setup.py" = ["INP001"]

[lint.pydocstyle]
convention = "google"
