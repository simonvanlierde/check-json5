- id: jsonvet
  name: jsonvet
  description: checks JSON, I-JSON, JSONC, JSON5, HuJSON and JSON Lines files for syntax errors and duplicate keys
  entry: jsonvet
  language: python
  files: (\.(json|jsonc|json5|geojson|jsonld|hujson|jwcc|code-workspace|code-snippets|webmanifest|jsonl|ndjson)|(^|/)\.babelrc)$
  types: [text]
  minimum_pre_commit_version: "2.0.0"
# The 1.x hook id, kept until 3.0.
- id: check-json5
  name: check json5
  description: the 1.x hook id of jsonvet, kept until 3.0
  entry: jsonvet
  language: python
  files: (\.(json|jsonc|json5|geojson|jsonld|hujson|jwcc|code-workspace|code-snippets|webmanifest|jsonl|ndjson)|(^|/)\.babelrc)$
  types: [text]
  minimum_pre_commit_version: "2.0.0"
