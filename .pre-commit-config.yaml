# Dependabot bumps these revs, so a hook run never edits this file.
# The corpus files keep their bytes exactly: missing final newlines, CRs, trailing spaces.
exclude: ^(tests/corpus|conformance/extra)/
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
          - id: check-toml
          - id: end-of-file-fixer
          - id: mixed-line-ending
          - id: no-commit-to-branch
          - id: trailing-whitespace
            args: ["--markdown-linebreak-ext", "md"]

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.10
      hooks:
          - id: ruff-check
          - id: ruff-format
