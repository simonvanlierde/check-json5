[package]
name = "jsonvet-cli"
description = "The jsonvet command: checks JSON, JSONC, JSON5, HuJSON and JSON Lines files."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "jsonvet"
path = "src/main.rs"

[dependencies]
jsonvet = { path = "../jsonvet", version = "=3.0.0" }
lexopt = "0.3.2"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
insta = "1.49.0"
# Only to parse the SARIF output in tests; the output itself is written by hand.
serde_json = "1.0.154"

[lints]
workspace = true
