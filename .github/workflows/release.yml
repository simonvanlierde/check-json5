name: release

# Publishes to PyPI with trusted publishing: no API token. The publisher is set up once at
# https://pypi.org/manage/account/publishing/ for repo simonvanlierde/check-json5,
# workflow `release.yml`, environment `pypi`.
#
# In the repo's Settings > Environments, `pypi` only accepts tags matching `v*` and needs
# a reviewer. Otherwise anyone who can push a branch could dispatch an edited copy of
# this workflow and publish from it.
#
# The build job re-runs the full suite, since a release tag can point at a commit that
# never went green. It then runs the suite against the installed wheel, the only place
# packaging faults such as a wrong module name show up.
#
# `id-token: write` exposes an OpenID Connect (OIDC) request token to every step in its
# job, so publish is a separate job that runs no project code.

# No workflow_dispatch: a manual run can target any branch, and neither trusted
# publishing nor the environment checks which ref it publishes.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: an entry written from any branch is restorable here, which would put
      # attacker-controlled bytes into the wheel this workflow publishes.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      # Publish only what passes, on the exact commit being released.
      - run: uv sync --locked
      - run: uv run ruff check --no-fix .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest

      - run: uv build

      # The suite again, against the wheel. It runs from a copy of tests/ outside the
      # checkout, so `import check_json5` can only find the installed wheel.
      - run: |
          cp -r tests "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl --with pytest pytest tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    # Job-level permissions replace the workflow-level grant, so restate contents.
    permissions:
      contents: read
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          # No checkout here: dist/ at the root, where the publish action looks.
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
