name: release

# Publishes jsonvet's wheels to PyPI, then the check-json5 compatibility package, and the
# jsonvet and jsonvet-cli crates to crates.io, all with trusted publishing: no API token. Both
# PyPI projects trust this workflow and the `pypi` environment, and both crates trust it and the
# `crates-io` environment. Each environment only accepts v* tags, so an edited copy of this
# workflow on a branch cannot publish.
#
# The wheels hold the jsonvet and check-json5 binaries (maturin bindings = "bin"), so a
# pre-commit or prek install downloads a prebuilt binary and never compiles Rust.
#
# `id-token: write` exposes an OpenID Connect (OIDC) request token to every step in its job, so
# the publish jobs run no project code.

# No workflow_dispatch: a manual run can target any branch, and neither trusted publishing nor
# the environment checks which ref it publishes.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The tag must name the same release as the crates and the hook placeholder's pin.
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: The versions agree and match the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # An assignment, not a pipe, so a failed check stops the step.
          versions=$(uv run scripts/check-versions.py)
          echo "$versions"
          version=$(echo "$versions" | awk '/^Cargo.toml/ {print $2}')
          test "v$version" = "$TAG" || { echo "tag $TAG does not match version $version"; exit 1; }

  wheels:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64, manylinux: auto}
          - {os: ubuntu-latest, target: aarch64, manylinux: auto}
          - {os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2}
          - {os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2}
          - {os: macos-latest, target: x86_64-apple-darwin}
          - {os: macos-latest, target: aarch64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
          - {os: windows-latest, target: aarch64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: an entry written from any branch is restorable here, which would put
      # attacker-controlled bytes into a wheel this workflow publishes.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/jsonvet-cli
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out ../../dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist/

  sdist:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/jsonvet-cli
          command: sdist
          args: --out ../../dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist/

  # Install the Linux wheel from what the matrix built, and run it, before anything uploads.
  smoke:
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-ubuntu-latest-x86_64-auto
          path: dist/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: |
          printf '{"a": 1, "a": 2}\n' > dup.json
          uv run --isolated --no-project --with dist/*.whl jsonvet dup.json && exit 1
          uv run --isolated --no-project --with dist/*.whl check-json5 dup.json && exit 1
          uv run --isolated --no-project --with dist/*.whl jsonvet --version

  publish-jsonvet:
    needs: [wheels, sdist, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    # Job-level permissions replace the workflow-level grant, so restate contents.
    permissions:
      contents: read
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # The old name, which only installs jsonvet. Built apart from its upload, so the job holding
  # the publishing token runs no build code.
  build-check-json5:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv build --out-dir dist compat/check-json5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-json5
          path: dist/

  # Uploaded last, so it never points at a jsonvet wheel that is not on PyPI yet.
  publish-check-json5:
    needs: [publish-jsonvet, build-check-json5]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: check-json5
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # `--no-verify` packages and uploads without compiling, so this job, which holds the token,
  # runs no build scripts. CI and the smoke job have already built this commit. jsonvet goes
  # first because jsonvet-cli pins it; cargo waits until the index has it.
  publish-crates:
    needs: [versions, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: |
          cargo publish --locked --no-verify -p jsonvet
          cargo publish --locked --no-verify -p jsonvet-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
