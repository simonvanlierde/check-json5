name: ci

# No push trigger: main only advances through a pull request, so a push run repeats the check
# that already passed on the pull request's head.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo deny check
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The repo's Python: the hook placeholder and scripts/.
      # The same ruff as .pre-commit-config.yaml.
      - run: uvx ruff@0.16.10 check --no-fix .
      - run: uvx ruff@0.16.10 format --check .
      # The crates, the placeholder's wheel pin and the check-json5 package name one release.
      - run: uv run scripts/check-versions.py
      # The conformance page is rendered from conformance/results/; the parser runs stay local.
      - run: uv run conformance/report.py && git diff --exit-code docs/conformance.md

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true # tests/json5-tests, for the conformance test
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace
      # nextest skips doctests.
      - run: cargo test --workspace --doc

  # The oldest Rust the crates support, from rust-version in Cargo.toml. Builds the library and
  # binaries only: test-only dependencies may need a newer compiler.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --lib --bins --locked

  # jsonvet against check-json5 1.4.1, file by file; see docs/design.md.
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: cargo build --release --locked -p jsonvet-cli
      - run: uv run scripts/differential.py --cases 5000

  # The wheel, built the way the release does, and the hook and the action as users install them,
  # on every OS: pre-commit and prek install this repository, and its placeholder setup.py pins
  # the jsonvet wheel. Until that version is on PyPI, the wheel built here stands in for it,
  # through pip's and uv's find-links settings.
  hook:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/jsonvet-cli
          args: --release --locked --out ../../dist
          manylinux: auto
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install the hook and run it
        shell: bash
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/dist
          UV_FIND_LINKS: ${{ github.workspace }}/dist
        run: |
          printf '{"a": 1}\n' > ok.json
          printf '{"a": 1, "a": 2}\n' > dup.json
          uv run --isolated --no-project --with dist/*.whl jsonvet dup.json && exit 1
          uv run --isolated --no-project --with dist/*.whl check-json5 dup.json && exit 1
          uv run --isolated --no-project --with dist/*.whl jsonvet --version
          for tool in pre-commit@4.7.0 prek@0.5.5; do
            uvx "$tool" try-repo . jsonvet --files ok.json
            if uvx "$tool" try-repo . check-json5 --files dup.json; then
              echo "$tool: the hook passed a duplicate key"
              exit 1
            fi
          done
      # The action from this checkout, installing the wheel built above instead of PyPI's.
      - name: Run the action on a duplicate key
        id: action-bad
        continue-on-error: true
        uses: $/
        env:
          PIP_NO_INDEX: "1"
          PIP_FIND_LINKS: ${{ github.workspace }}/dist
        with:
          files: dup.json ok.json
          sarif: jsonvet.sarif
      - name: Check that the action failed and wrote one SARIF result
        shell: bash
        env:
          OUTCOME: ${{ steps.action-bad.outcome }}
        run: |
          test "$OUTCOME" = failure
          uv run --isolated --no-project python -c '
          import json
          results = json.load(open("jsonvet.sarif"))["runs"][0]["results"]
          assert [r["ruleId"] for r in results] == ["duplicate-key"], results
          '
      - name: Run the action on a valid file
        uses: $/
        env:
          PIP_NO_INDEX: "1"
          PIP_FIND_LINKS: ${{ github.workspace }}/dist
        with:
          files: ok.json
