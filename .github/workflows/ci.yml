name: CI

# No push trigger: main only advances through a PR, so a push run repeats
# the check that already passed on the PR head.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # The prek hooks run only where someone installed them, and never on
      # Dependabot pull requests, so lint and types are checked here too.
      - run: uv run --group dev ruff check --no-fix .
      - run: uv run --group dev ruff format --check .
      - run: uv run --group dev ty check
      - run: uv run --group dev pytest --cov=check_json5 --cov-report=term-missing --cov-report=xml --cov-fail-under=95
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.python-version == '3.13'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
