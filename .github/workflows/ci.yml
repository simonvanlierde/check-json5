name: CI

# No push trigger: main only advances through a PR, so a push run repeats
# the check that already passed on the PR head.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # The prek hooks run only where someone installed them, and never on
      # Dependabot pull requests, so lint and types are checked here too.
      - run: uv run --group dev ruff check --no-fix .
      - run: uv run --group dev ruff format --check .
      - run: uv run --group dev ty check
      - run: uv run --group dev pytest --cov=pre_commit_hooks --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
