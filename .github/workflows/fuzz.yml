name: fuzz

# Each night, every cargo-fuzz target runs for 20 minutes (see docs/design.md). A crashing input is
# kept as an artifact.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [check, diff_serde_json, diff_json5]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true # json5-tests seeds the corpus
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz
      - name: Seed the corpus from json5-tests
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          find tests/json5-tests -name '*.json*' -exec cp {} "fuzz/corpus/$TARGET/" \;
        env:
          TARGET: ${{ matrix.target }}
      - run: cargo +nightly fuzz run -O "$TARGET" -- -max_total_time=1200 -print_final_stats=1
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
