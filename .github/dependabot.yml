version: 2
# A 7-day cooldown: a compromised release is usually caught and yanked within that window.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      cargo-deps:
        patterns:
          - "*"
      # Advisories arrive outside the weekly window and ignore the groups above,
      # so without this each one opens its own pull request and its own CI run.
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      pre-commit-deps:
        patterns:
          - "*"
