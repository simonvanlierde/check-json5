version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
    groups:
      uv-deps:
        patterns:
          - "*"
      # Advisories arrive outside the weekly window and ignore the groups above,
      # so without this each one opens its own pull request and its own CI run.
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
    groups:
      actions-deps:
        patterns:
          - "*"
