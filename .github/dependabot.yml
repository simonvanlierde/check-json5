version: 2
# A 7-day cooldown, the same window as uv's exclude-newer, so no update waits on the lock.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      uv-deps:
        patterns:
          - "*"
      # Advisories arrive outside the weekly window and ignore the groups above,
      # so without this each one opens its own pull request and its own CI run.
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      pre-commit-deps:
        patterns:
          - "*"
