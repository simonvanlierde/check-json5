# CI uploads cargo-llvm-cov's report. Codecov fails a pull request only when total coverage
# falls below 85%. Patch coverage is reported against the same bar but never fails.
coverage:
  status:
    project:
      default:
        target: 85%
    patch:
      default:
        target: 85%
        informational: true

# Comment only when total coverage went down. Any drop counts, however small.
comment:
  require_changes: "coverage_drop"
