# Codecov reports coverage; CI's tests are the gate. It fails a pull request only when
# total coverage drops by more than 2 points, and the new lines' share is shown, not
# enforced.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        informational: true

# No pull request comments: Codecov posts an "all lines covered" note even with
# require_changes set. A failing project check is the notice.
comment: false
