# CI uploads cargo-llvm-cov's report and sets no minimum. Codecov only fails a pull request
# when total coverage drops by more than 2 points.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        informational: true

# Comment only when the project check fails: coverage_drop honours its 2-point threshold.
comment:
  require_changes: "coverage_drop"
