[build-system]
  build-backend = "setuptools.build_meta"
  # 77 reads the SPDX `license` string below.
  requires = ["setuptools>=77"]

[project]
  authors         = [{ "name" = "Simon van Lierde", "email" = "30519500-simonvanlierde@users.noreply.gitlab.com" }]
  classifiers     = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
  ]
  dependencies    = ["json5>=0.15.0"]
  description     = "pre-commit hook to check json files for syntax parseable as json5 (with comments)"
  keywords        = ["json", "json5", "jsonc", "lint", "pre-commit"]
  license         = "MIT"
  name            = "check-json5"
  readme          = "README.md"
  requires-python = ">=3.10"
  version         = "1.3.0"

  [project.urls]
    Changelog = "https://github.com/simonvanlierde/check-json5/blob/main/CHANGELOG.md"
    Issues    = "https://github.com/simonvanlierde/check-json5/issues"
    Source    = "https://github.com/simonvanlierde/check-json5"

  [project.scripts]
    check-json5 = "check_json5.check_json5:main"

[dependency-groups]
  dev = ["pre-commit>=4.6.0", "pytest>=8", "pytest-cov>=5", "ruff>=0.15.20", "ty>=0.0.56"]

[tool.ruff]
  fix            = true
  line-length    = 120
  target-version = "py310"

  [tool.ruff.format]
    docstring-code-format = true

  [tool.ruff.lint]
    extend-select = ["ALL"]
    fixable       = ["ALL"]

    # These rules are ignored to prevent conflicts with formatter or because they are overly strict
    ignore = [
      "COM812", # missing-trailing-comma: conflicts with the formatter
      "CPY001", # missing-copyright-notice: LICENSE covers the project
      "D206",   # indent-with-spaces
      "D300",   # triple-single-quotes
      "E111",   # indentation-with-invalid-multiple
      "E114",   # indentation-with-invalid-multiple-comment
      "E117",   # over-indented
      "ISC001", # single-line-implicit-string-concatenation
      "ISC002", # multi-line-implicit-string-concatenation
      "RET504", # unnecessary-assign
      "W191",   # tab-indentation
    ]

    [tool.ruff.lint.per-file-ignores]
      "tests/**" = ["S101", "D103"]
      # Standalone script that prints a results table.
      "scripts/**" = ["INP001", "T201"]
      # CLI entry point: printing failures to stdout is the hook's job.
      "check_json5/check_json5.py" = ["T201"]

    [tool.ruff.lint.pydocstyle]
      convention = "google"

[tool.setuptools]
  # Named, not discovered: a stale ignored folder such as an old pre_commit_hooks/ makes
  # discovery see two packages and refuse to build.
  packages = ["check_json5"]

[tool.uv]
  package = true
